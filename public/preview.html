<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>AI-B Trading Desk</title>
 <link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Anton&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg-void:#050810;--panel:#0B1424;--panel-raised:#0F1D35;--panel-glass:rgba(15,29,53,0.85);--border:#1E3A63;--border-soft:#142544;--text-primary:#F5F7FA;--text-muted:#93A3BF;--text-dim:#56698C;--gold:#D9AE67;--gold-bright:#F0C888;--gold-dim:#5E4A26;--blue:#1F5FBF;--blue-deep:#034694;--blue-dim:#0A2A57;--bull:#42BE96;--bull-dim:#1B4438;--bear:#E06465;--bear-dim:#48211F;--cyan:#1F5FBF;--radius:9px;--radius-sm:6px;--shadow-card:0 1px 2px rgba(0,0,0,0.5), 0 8px 24px -12px rgba(3,70,148,0.35);}*{box-sizing:border-box;}body{margin:0;background:var(--bg-void);color:var(--text-primary);font-family:'Inter',sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;position:relative;}body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(1.6px 1.6px at 8% 12%, rgba(255,255,255,0.85), transparent),radial-gradient(1.2px 1.2px at 22% 38%, rgba(240,200,136,0.75), transparent),radial-gradient(1.8px 1.8px at 35% 8%, rgba(255,255,255,0.6), transparent);background-repeat:repeat;background-size:480px 480px;animation:twinkle 7s ease-in-out infinite alternate;}@keyframes twinkle{from{opacity:0.4;}to{opacity:0.85;}}.app{display:flex;min-height:100vh;position:relative;z-index:1;}.sidebar{width:206px;flex-shrink:0;background:linear-gradient(180deg,var(--panel),#040910);border-right:1px solid var(--border);padding:22px 0;display:flex;flex-direction:column;position:fixed;height:100vh;overflow-y:auto;z-index:40;}.brand{padding:0 22px 20px;border-bottom:1px solid var(--border);margin-bottom:14px;}.brand-title{font-family:'Anton',sans-serif;font-weight:400;font-size:19px;letter-spacing:0.03em;text-transform:uppercase;background:linear-gradient(135deg,var(--gold-bright),var(--gold) 55%,var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent;}.nav{display:flex;flex-direction:column;gap:2px;padding:0 11px;}.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-sm);cursor:pointer;color:var(--text-muted);font-family:'Oswald',sans-serif;font-size:13px;font-weight:500;letter-spacing:0.01em;border-left:2px solid transparent;transition:background .12s,color .12s;}.nav-item.active{background:var(--panel-raised);color:var(--gold-bright);border-left:2px solid var(--blue);}.main{flex:1;min-width:0;padding:28px 36px 70px;max-width:1200px;margin-left:206px;}.page{display:none;}.page.active{display:block;animation:fadein .15s ease;}@keyframes fadein{from{opacity:0;}to{opacity:1;}}
</style>
</head>
<body>
<div class="app">
<div class="sidebar">
<div class="brand"><div class="brand-title">AI-B TRADING DESK</div></div>
<div class="nav" id="navDesktop"></div>
</div>
<div class="main">
<div class="page active" id="page-dashboard">
<h1 style="color:var(--text-primary);">Dashboard</h1>
<p style="color:var(--text-muted);">Phase 3 trading desk preview — fully featured single-page app</p>
</div>
</div>
</div>
<script>
var NAV_ITEMS=[{id:'dashboard',label:'Dashboard'},{id:'analyze',label:'Analyze'},{id:'journal',label:'Journal'}];document.getElementById('navDesktop').innerHTML=NAV_ITEMS.map(function(n,i){return'<div class="nav-item'+(i===0?' active':'')+'" data-page="'+n.id+'"><span>'+n.label+'</span></div>';}).join('');
</script>
</body>
</html>
